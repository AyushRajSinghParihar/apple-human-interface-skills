name: Check Apple HIG drift

# Each week, compare Apple's current HIG pages with the reviewed snapshot.
# If a page changed, open or update one issue with the label hig-drift.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compare the live source with the snapshot
        id: live
        run: |
          set +e
          python scripts/hig.py drift > drift.json
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update the drift issue
        if: steps.live.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > body.md
          import json
          report = json.load(open("drift.json"))
          print("Apple's HIG differs from the reviewed snapshot "
                f"({report['snapshot_at']}). Run `hig.py discover`, then the review-remap, "
                "review-scaffold and review-renew steps in CONTRIBUTING.md.\n")
          for kind, title in (("guidance", "Guidance changed"), ("metadata", "Only metadata or links changed"),
                              ("new", "New pages"), ("removed", "Pages no longer found"), ("error", "Fetch errors")):
              rows = [item for item in report["drift"] if item["kind"] == kind]
              if rows:
                  print(f"## {title} ({len(rows)})\n")
                  print("\n".join(f"- `{item['path']}`" + (f": {item['detail']}" if item.get("detail") else "") for item in rows))
                  print()
          PY
          gh label create hig-drift --color D93F0B --description "Apple HIG source changed" --force
          number=$(gh issue list --label hig-drift --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "Apple HIG source drift" --label hig-drift --body-file body.md
          fi
      - name: Fail on errors other than drift
        if: steps.live.outputs.status != '0' && steps.live.outputs.status != '1'
        run: exit 1
